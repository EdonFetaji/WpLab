<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8">
    <title>Book Reservation - Welcome and choose a Book</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        .book-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .book-option:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Book Reservation App</h1>
</header>

<section style="padding-bottom: 200px;">

    <form action="/books" method="post" style="display: flex; justify-content: space-around; ">

        <label> Text: <input type="text" name="textContent"/></label>
        <label> Rating: <input type="number" step="any" name="rating"/></label>
        <button type="submit">
            Search
        </button>

    </form>

    <ul style="padding-bottom: 100px; padding-left:80px; padding-top: 20px;">
        <th:block th:if="${searchResults != null && searchResults.size() > 0}">

            <div th:each="bookRes: ${searchResults}">
                <li th:text=" 'Title: ' + ${bookRes.title} + ', Genre: '
                    +  ${bookRes.genre} + ', Rating: ' +  ${bookRes.averageRating}+' Author: '+${bookRes.getAuthor().getName()}+' '+ ${bookRes.getAuthor().getSurname()}">
                </li>

                <a th:href="@{'/books/book-form/'+${bookRes.id}}">
                    Edit
                </a>

                <form method="post" th:action="@{'/books/delete/'+${bookRes.id}}">
                    <button type="submit">
                        Delete
                    </button>
                </form>
            </div>

        </th:block>
    </ul>
</section>
<hr>
<main>
    <div th:if="${error != null}" th:text="${error}" style="color: red; font-size: 42px;">

    </div>
    <a th:href="@{'/books/book-form'}">
        Add a New Book
    </a>

    <form th:action="@{'/bookReservations/add'}" method="POST">
        <h2>Choose a book:</h2>

        <th:block>
            <label>
                <div th:each="book : ${bookList}">
                    <input type="radio" name="bookTitle" class="book-option"
                           th:value="${book.title}"
                           th:text=" 'Title: ' + ${book.title} + ', Genre: ' +  ${book.genre} + ', Rating: ' +  ${book.averageRating}+' Author: '+${book.getAuthor().getName()}+' '+ ${book.getAuthor().getSurname()} "/>
                    <br>

                </div>
            </label>

        </th:block>


        <!-- Display radio buttons for each book,
             the value should be the book title
             and the displayed text should be:
             Title: <book_title>, Genre: <book_genre>, Rating: <average_rating> -->

        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="readerName" required><br/>
        <label>Your Address:</label>
        <input type="text" name="readerAddress" required><br/>

        <h2>Choose number of copies:</h2>
        <input type="number" name="numberOfCopies" min="1" max="10" required><br/>
        <br/>
        <button type="submit"> Reserve BOOK</button>

    </form>


</main>
</body>
</html>
