<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Reservation - Welcome and choose a Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow">

        <!-- Header -->
        <div class="card-header bg-primary text-white text-center py-3">
            <h1 class="h3 mb-0">Book Reservation System</h1>
        </div>

        <div class="card-body p-4">

            <!-- Authentication Info -->
            <div class="d-flex justify-content-between align-items-center mb-4" sec:authorize="isAuthenticated()">
                <span>Welcome, <strong sec:authentication="name"></strong></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                </form>
            </div>

            <div class="text-end mb-4" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-outline-primary">Login</a>
            </div>

            <!-- Search Section -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Search Books</h5>
                </div>
                <div class="card-body">
                    <form action="/books" method="post">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label class="form-label">Search Text</label>
                                <input type="text" name="textContent" class="form-control" placeholder="Enter title, genre, or author..."/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Minimum Rating</label>
                                <input type="number" step="any" name="rating" class="form-control" placeholder="e.g., 4.5"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label d-block">&nbsp;</label>
                                <button type="submit" class="btn btn-primary w-100">Search</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Search Results -->
            <div th:if="${searchResults != null && searchResults.size() > 0}" class="mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Search Results</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <div th:each="bookRes: ${searchResults}" class="list-group-item">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <h6 class="mb-1" th:text="${bookRes.title}"></h6>
                                        <p class="mb-1 text-muted small">
                                            <span th:text="${bookRes.genre}"></span> |
                                            Rating: <span th:text="${bookRes.averageRating}"></span> |
                                            Author: <span th:text="${bookRes.getAuthor().getName()} + ' ' + ${bookRes.getAuthor().getSurname()}"></span>
                                        </p>
                                    </div>
                                    <div class="btn-group" sec:authorize="hasRole('ADMIN')">
                                        <a th:href="@{'/books/book-form/'+${bookRes.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                                        <form method="post" th:action="@{'/books/delete/'+${bookRes.id}}" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${error != null}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <div class="text-end mb-3" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{'/books/book-form'}" class="btn btn-success">Add New Book</a>
            </div>

            <hr class="my-4">

            <form th:action="@{'/bookReservations/add'}" method="POST">

                <div class="mb-4">
                    <h5 class="mb-3">Choose a Book</h5>
                    <div th:each="book : ${bookList}" class="mb-2">
                        <div class="card">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="bookTitle"
                                           th:value="${book.title}"
                                           th:id="'book-' + ${book.id}">
                                    <label class="form-check-label" th:for="'book-' + ${book.id}">
                                        <strong th:text="${book.title}"></strong> -
                                        <span th:text="${book.genre}"></span> |
                                        Rating: <span th:text="${book.averageRating}"></span> |
                                        Author: <span th:text="${book.getAuthor().getName()} + ' ' + ${book.getAuthor().getSurname()}"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Reader Information -->
                <div class="mb-4">
                    <h5 class="mb-3">Your Information</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="readerName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" name="readerAddress" class="form-control" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Number of Copies</label>
                            <input type="number" name="numberOfCopies" class="form-control" min="1" max="10" value="1" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Reserve Book</button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
